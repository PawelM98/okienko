services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-okienko}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-okienko}
      POSTGRES_DB: ${DB_NAME:-okienko}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: